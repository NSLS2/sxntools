[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "sxntools"
authors = [
  { name = "Brookhaven National Laboratory", email = "thopkins1@bnl.gov" },
]
description = "Tools for the NSLS-II Soft X-ray Nanoprobe beamline"
license = "BSD-3-Clause"
requires-python = ">=3.11,<3.14"
classifiers = [
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
pixelator = [
  "pyzmq>=27.2,<28",
  "ophyd-async>=0.21.3,<0.22",
  "bluesky>=1.15.1,<1.16",
  "event-model>=1.24,<1.25",
  "bluesky-tiled-plugins>=2.0.12,<2.1",
  "tiled[server]>=0.2.19,<0.3",
  "h5py>=3.16,<4",
]

[dependency-groups]
dev = [
  "pre-commit",
  "pyright",
  "pytest",
  "pytest-cov",
  "ruff",
]

[project.urls]
Homepage = "https://github.com/NSLS2/sxntools"
Issues = "https://github.com/NSLS2/sxntools/issues"
Changelog = "https://github.com/NSLS2/sxntools/releases"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src/sxntools"]

[tool.pyright]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.coverage.paths]
# Tests run against the installed package; map coverage back to the source tree.
source = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 125
lint.select = [
  "B",       # flake8-bugbear
  "C4",      # flake8-comprehensions
  "D",       # pydocstyle
  "E",       # pycodestyle errors
  "F",       # Pyflakes
  "I",       # isort
  "LOG015",  # root logger calls
  "N",       # pep8-naming
  "PLC2701", # private imports
  "S101",    # assert
  "SLF",     # private member access
  "UP",      # pyupgrade
  "W",       # pycodestyle warnings
]
lint.ignore = [
  "D102", # Inherited abstract methods do not need duplicate docstrings.
  "D107", # Class docstrings document initialization.
]
lint.preview = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["D", "S101", "SLF001"]
