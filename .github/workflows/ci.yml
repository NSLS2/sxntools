name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.13"
          enable-cache: true

      - name: Install development environment
        run: uv sync --group dev --extra pixelator

      - name: Run pre-commit checks
        run: uv run --extra pixelator pre-commit run --all-files --show-diff-on-failure

      - name: Run tests
        run: uv run --extra pixelator pytest -q

      - name: Build distributions
        run: uv build
